# Nginx Proxy Manager deployment overlay for strchive-link.
#
# Self-contained (used standalone, not layered on docker-compose.yml): one
# unified container serves /health and the MCP streamable-HTTP transport on /mcp
# via a single port (8000). NPM reverse-proxies to the fixed container_name on
# the shared external npm_default network.
#
#   docker compose -f docker/docker-compose.npm.yml --env-file .env.docker up -d
name: strchive-link-npm

services:
  strchive_link:
    # Deploy pulls the released, attested image; it never builds from source.
    # Pin a digest, not a tag: there is no `latest`, and only a digest is immutable.
    image: ${STRCHIVE_LINK_IMAGE:?Set STRCHIVE_LINK_IMAGE to ghcr.io/berntpopp/strchive-link@sha256:<digest>}
    pull_policy: missing
    container_name: strchive-link-npm
    # NO published host ports - NPM handles all routing via the container name.
    expose:
      - "8000"
    environment:
      - STRCHIVE_LINK_HOST=0.0.0.0
      - STRCHIVE_LINK_PORT=8000
      - STRCHIVE_LINK_TRANSPORT=unified
      - STRCHIVE_LINK_MCP_PATH=/mcp
      - 'STRCHIVE_LINK_ALLOWED_HOSTS=["localhost","127.0.0.1","::1","strchive-link.genefoundry.org"]'
      - STRCHIVE_LINK_LOG_LEVEL=${LOG_LEVEL_API:-INFO}
      - STRCHIVE_LINK_LOG_FORMAT=json
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    read_only: true
    # GeneFoundry deploy contract: the fleet controller (strato_v6_docker_npm,
    # scripts/utils/deployment_preflight.py) accepts a declared user only as numeric
    # non-root, and its runtime observer proves the effective uid from /proc.
    # This is THIS image's own uid:gid (docker/Dockerfile) -- sibling -link images differ.
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    networks:
      - strchive_link_internal_net
      - npm_proxy_network
    deploy:
      resources:
        limits:
          memory: ${STRCHIVE_API_MEMORY_LIMIT:-512m}
          cpus: ${STRCHIVE_API_CPU_LIMIT:-1.0}
          pids: 256
        reservations:
          memory: 128m
          cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=strchive-link,environment=production,proxy=npm"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true

networks:
  strchive_link_internal_net:
    driver: bridge
    name: strchive_link_internal_net
  npm_proxy_network:
    external: true
    name: ${NPM_SHARED_NETWORK_NAME:-npm_default}
